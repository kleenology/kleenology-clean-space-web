[build]
  publish = "dist"
  command = "npm install && npx vite build"

[build.environment]
  NODE_VERSION = "18"

[functions]
  directory = "netlify/functions"

# Canonical domain: send the default Netlify subdomain to kleenology.me so all
# traffic, analytics, and Meta pixel events land on the one verified domain.
# Must stay above the other rules -- Netlify applies the first match.
# Deploy previews (<hash>--kleenologysa.netlify.app) are a different host and
# keep working untouched.
[[redirects]]
  from = "https://kleenologysa.netlify.app/*"
  to = "https://kleenology.me/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://kleenologysa.netlify.app/*"
  to = "https://kleenology.me/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/visitors"
  to = "/.netlify/functions/visitors"
  status = 200

[[redirects]]
  from = "/api/deposit/config"
  to = "/.netlify/functions/deposit-config"
  status = 200

[[redirects]]
  from = "/api/deposit/create"
  to = "/.netlify/functions/create-deposit"
  status = 200

[[redirects]]
  from = "/api/payment/status"
  to = "/.netlify/functions/payment-status"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css" 

# Security headers set via Netlify (do not inject via meta at runtime)
[[headers]]
  for = "/index.html"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"